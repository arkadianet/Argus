[workspace]
resolver = "2"
members = [
    "crates/wallet-core",
    "crates/wallet-net",
    "crates/wallet-ffi",
    "crates/vendor/citadel-core",
    "crates/vendor/ergo-tx",
    "crates/vendor/ergo-node-client",
    "crates/vendor/ergopay-core",
    "crates/vendor/protocols/amm",
    "crates/vendor/protocols/sigmausd",
    "crates/vendor/protocols/dexy",
    "crates/vendor/protocols/duckpools",
    "crates/vendor/protocols/rosen",
    "crates/vendor/protocols/sigmafi",
    "crates/vendor/protocols/stake-recovery",
    "crates/vendor/protocols/stealth",
    "crates/vendor/protocols/zerojoin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["arkadianet"]
license = "MIT"
repository = "https://github.com/arkadianet/argus"

[workspace.dependencies]
# ─── Core Ergo (pinned SHA) ──────────────────────────────────────────────
# A develop commit, not a crates.io release: the newest release (0.28.0, 2024)
# lacks APIs Argus uses, and its ergo-chain-types requires url ~2.2, which
# cannot resolve alongside reqwest. eccb8eac is the newest develop commit
# still versioned 0.28.x, which ergo-node-interface requires; see
# docs/dependency-list.md before moving it.
ergo-lib = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergo-chain-types = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergotree-ir = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergotree-interpreter = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
sigma-ser = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergo-merkle-tree = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergo-nipopow = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergo-rest = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }

# ─── Node interface (via ergo-node-interface-rust) ───────────────────────
ergo-node-interface = { git = "https://github.com/arkadianet/ergo-node-interface-rust", rev = "0264f6ffcb954da135960460d942f4c804ed65c9" }

# ─── Async ───────────────────────────────────────────────────────────────
futures = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }

# ─── Serialization ───────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ─── Error handling ──────────────────────────────────────────────────────
thiserror = "2"
anyhow = "1"

# ─── Logging / tracing ───────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ─── Crypto utilities ────────────────────────────────────────────────────
hex = "0.4"
base16 = "0.2"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
sha2 = "0.11"
hmac = "0.13"

# ─── KDF + encryption ────────────────────────────────────────────────────
argon2 = "0.6"
aes-gcm = "0.11"
rand = "0.10"

# ─── FFI ─────────────────────────────────────────────────────────────────
flutter_rust_bridge = "=2.11.1"

# ─── HTTP ────────────────────────────────────────────────────────────────
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
# reqwest 0.13 dropped its bundled-roots rustls feature, so wallet-net::http
# builds the TLS config 0.12's "rustls-tls" gave: ring and webpki-roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# ─── Vendored Citadel crates ─────────────────────────────────────────────
citadel-core = { path = "crates/vendor/citadel-core" }
ergo-node-client = { path = "crates/vendor/ergo-node-client" }
ergo-tx = { path = "crates/vendor/ergo-tx" }
ergopay-core = { path = "crates/vendor/ergopay-core" }
amm = { path = "crates/vendor/protocols/amm" }
sigmausd = { path = "crates/vendor/protocols/sigmausd" }
dexy = { path = "crates/vendor/protocols/dexy" }
duckpools = { path = "crates/vendor/protocols/duckpools" }
rosen = { path = "crates/vendor/protocols/rosen" }
sigmafi = { path = "crates/vendor/protocols/sigmafi" }
stake-recovery = { path = "crates/vendor/protocols/stake-recovery" }
stealth = { path = "crates/vendor/protocols/stealth" }
zerojoin = { path = "crates/vendor/protocols/zerojoin" }

# ─── Misc ────────────────────────────────────────────────────────────────
indexmap = "2"
num-bigint = "0.5"
num-traits = "0.2"

# Patch ergo crates to the pinned SHA (mirrors Citadel's patch approach)
[patch.crates-io]
ergo-lib = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergo-chain-types = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergotree-ir = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergotree-interpreter = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
sigma-ser = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergo-merkle-tree = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergo-nipopow = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }
ergo-rest = { git = "https://github.com/ergoplatform/sigma-rust", rev = "eccb8eac97fecae3cd09b2240805ae112963a6c7" }