[package]
name = "rosen"
version = "0.1.0"
edition = "2021"
description = "Rosen bridge from Ergo: the tokens map, the fee boxes, the lock transaction and target-chain address checks"

[dependencies]
bs58 = "0.5"
ergo-lib = { workspace = true }
ergo-tx = { workspace = true, features = ["ergo-lib"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
